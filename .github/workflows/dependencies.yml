name: Dependency policy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate exception reasons
        run: |
          python3 scripts/check-license-exceptions.py
          python3 scripts/test-license-exceptions.py
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-deny@0.20.2
      - name: Licenses and RustSec advisories (workspace and fuzz)
        # Maintenance notices stay visible without treating them as vulnerabilities.
        # Known vulnerabilities, unsoundness and yanked versions still fail.
        # Audit both independent lockfiles even when the first one fails.
        shell: bash
        run: |
          result=0
          cargo deny --all-features check --warn unmaintained licenses advisories || result=1
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --all-features check --warn unmaintained licenses advisories || result=1
          exit "$result"
