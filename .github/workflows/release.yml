# Builds the Windows packages (x64 and ARM64) and publishes them as a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0     -> release "v0.1.0" with both zips
#   Actions tab -> Release -> Run workflow        -> the same build, kept as a workflow artifact
#                                                    (no release; to try the build)
#
# The tag must match the version in Cargo.toml. Both architectures are built on one x64
# runner: ARM64 is cross-compiled (clang, preinstalled with LLVM, builds the crypto library).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          rustc --version

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match the Cargo.toml version $version"
          }

      - name: Check (clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # A tagged release must be signed (repository secret PLAYTERM_SIGNING_KEY): the in-app
      # updater installs only releases whose SHA256SUMS.txt.sig matches its public key.
      - name: Package (x64, ARM64)
        shell: pwsh
        env:
          PLAYTERM_SIGNING_KEY: ${{ secrets.PLAYTERM_SIGNING_KEY }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") { ./scripts/package.ps1 -Upx -Sign } else { ./scripts/package.ps1 -Upx }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $sums = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          $notes = @"
          Windows packages of playterm $tag (portable: unzip and run ``playterm.exe``).

          | File | For |
          |---|---|
          | ``playterm-*-windows-x64.zip`` | Intel / AMD 64-bit Windows |
          | ``playterm-*-windows-arm64.zip`` | ARM64 Windows (Snapdragon, ...) |

          The executables are not code-signed, so Windows SmartScreen may warn on the first run
          (More info -> Run anyway). They are compressed with UPX, which some antivirus products
          flag by mistake.

          SHA-256 (``SHA256SUMS.txt.sig`` is its Ed25519 signature, checked by the in-app updater):
          ``````
          $sums
          ``````
          "@
          gh release create $tag dist/*.zip dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig --verify-tag --title "playterm $tag" --notes $notes

      - name: Keep the packages (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: playterm-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt*
