# Builds the Windows packages (x64 and ARM64) and the macOS apps (Apple silicon and Intel) and
# publishes them as a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0     -> release "v0.1.0" with every zip
#   Actions tab -> Release -> Run workflow        -> the same builds, kept as workflow artifacts
#                                                    (no release; to try the build)
#
# The tag must match the version in Cargo.toml. Both Windows architectures are built on one x64
# runner: ARM64 is cross-compiled (clang, preinstalled with LLVM, builds the crypto library).
# Both macOS architectures are built on one Apple silicon runner (x64 cross-compiled). The
# release is published only when every build succeeded.
#
# Code signing, when its repository secrets are set (without them the builds are as before):
#   Windows  WINDOWS_CERT_PFX (base64 of the .pfx), WINDOWS_CERT_PASSWORD
#            -> playterm.exe signed with signtool (SHA-256, timestamped) after UPX
#   macOS    MACOS_CERT_P12 (base64 of a "Developer ID Application" .p12), MACOS_CERT_PASSWORD
#            -> the apps signed with the hardened runtime; with MACOS_NOTARY_APPLE_ID,
#            MACOS_NOTARY_TEAM_ID and MACOS_NOTARY_PASSWORD (app-specific) also notarized and stapled
# Secrets are given only to the steps that package and sign, which run no cargo: the builds (and
# with them every dependency's build script) run first, without any secret in their environment.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      codesigned: ${{ steps.package.outputs.codesigned }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          rustc --version

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            throw "tag $env:TAG does not match the Cargo.toml version $version"
          }

      - name: Check (clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build (x64, ARM64)
        shell: pwsh
        run: ./scripts/package.ps1 -BuildOnly

      # A tagged release must be signed (repository secret PLAYTERM_SIGNING_KEY): the in-app
      # updater installs only releases whose SHA256SUMS.txt.sig matches its public key.
      - name: Package and sign (x64, ARM64)
        id: package
        shell: pwsh
        env:
          PLAYTERM_SIGNING_KEY: ${{ secrets.PLAYTERM_SIGNING_KEY }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $options = @{ BothVariants = $true; SkipBuild = $true }
          if ($env:GITHUB_REF -like "refs/tags/*") { $options.Sign = $true }
          if ($env:WINDOWS_CERT_PFX) { $options.CodeSign = $true }
          ./scripts/package.ps1 @options
          "codesigned=$(if ($options.CodeSign) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playterm-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt*
            dist/*.verification.json
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.certificate.outputs.signed }}
      notarized: ${{ steps.package.outputs.notarized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match the Cargo.toml version $version" >&2
            exit 1
          fi

      # clippy runs in the Windows job (the code checked with -D warnings is mostly shared).
      - name: Test
        run: cargo test --locked --workspace

      - name: Build (arm64, x64)
        run: scripts/package-macos.sh --build-only arm64 x64

      # Whether the signing secrets are set (not their values).
      - name: Signing secrets
        id: secrets
        run: |
          echo "certificate=${{ secrets.MACOS_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"
          echo "notary=${{ secrets.MACOS_NOTARY_APPLE_ID != '' }}" >> "$GITHUB_OUTPUT"

      # The certificate goes into a keychain of its own, deleted at the end of the job.
      - name: Developer ID certificate
        id: certificate
        if: steps.secrets.outputs.certificate == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "MACOS_CERT_P12 holds no Developer ID Application certificate" >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Without the certificate the apps are signed ad hoc, and Gatekeeper asks on the first run.
      - name: Package, sign and notarize (arm64, x64)
        id: package
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          scripts/package-macos.sh --skip-build arm64 x64
          if [ "${{ steps.secrets.outputs.notary }}" = true ]; then echo "notarized=true" >> "$GITHUB_OUTPUT"; fi

      - name: Remove the signing keychain
        if: always() && steps.certificate.outcome == 'success'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playterm-macos
          path: |
            dist/*.zip
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CODESIGNED: ${{ needs.windows.outputs.codesigned }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          set -eu
          ls -l dist
          if [ "$CODESIGNED" = true ]; then
            windows_note="The Windows executables are code-signed. The standard ZIPs are uncompressed; optional -upx ZIPs contain UPX-compressed executables."
          else
            windows_note="The Windows executables are not code-signed, so Windows SmartScreen may warn on the first run. The standard ZIPs are uncompressed; optional -upx ZIPs contain UPX-compressed executables."
          fi
          if [ "$NOTARIZED" = true ]; then
            macos_note="The macOS apps are signed with a Developer ID and notarized by Apple."
          elif [ "$MACOS_SIGNED" = true ]; then
            macos_note="The macOS apps are signed with a Developer ID but not notarized, so macOS asks before the first run of a downloaded app: right-click playterm.app -> Open."
          else
            macos_note="The macOS apps are signed ad hoc and not notarized, so macOS stops the first run of a downloaded app: right-click playterm.app -> Open, or System Settings -> Privacy & Security -> Open Anyway."
          fi
          windows_sums=$(tr -d '\r' < dist/SHA256SUMS.txt)
          macos_sums=$(cat dist/SHA256SUMS-macos.txt)
          tick='`'
          fence='```'
          cat > dist/packages.md <<EOF
          Packages of playterm $TAG.

          | File | For |
          |---|---|
          | ${tick}playterm-*-windows-x64.zip${tick} | Intel / AMD 64-bit Windows (portable: unzip and run ${tick}playterm.exe${tick}) |
          | ${tick}playterm-*-windows-arm64.zip${tick} | ARM64 Windows (Snapdragon, ...) |
          | ${tick}playterm-*-windows-x64-upx.zip${tick} | Optional smaller UPX executable for x64 Windows |
          | ${tick}playterm-*-windows-arm64-upx.zip${tick} | Optional smaller UPX executable for ARM64 Windows |
          | ${tick}playterm-*-macos-arm64.zip${tick} | Apple silicon Macs, macOS 11 or later (unzip and move ${tick}playterm.app${tick} to Applications) |
          | ${tick}playterm-*-macos-x64.zip${tick} | Intel Macs, macOS 11 or later |

          $windows_note

          UPX can trigger antivirus false positives. The uncompressed variant does not guarantee their absence. Automatic updates select the standard, uncompressed package for both variants, including existing UPX installations.

          $macos_note

          SHA-256 of the Windows packages (${tick}SHA256SUMS.txt.sig${tick} is its Ed25519 signature, checked by the in-app updater):
          ${fence}
          $windows_sums
          ${fence}

          SHA-256 of the macOS packages (${tick}SHA256SUMS-macos.txt${tick}):
          ${fence}
          $macos_sums
          ${fence}
          EOF
          python3 scripts/release-notes.py --tag "$TAG" --repository "$GH_REPO" \
            --package-notes dist/packages.md --output dist/notes.md
          cd dist
          gh release create "$TAG" *.zip SHA256SUMS.txt SHA256SUMS.txt.sig SHA256SUMS-macos.txt \
            --verify-tag --title "playterm $TAG" --notes-file notes.md
