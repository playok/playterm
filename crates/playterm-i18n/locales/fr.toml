"console.help" = "\u001b[1mCommandes disponibles\u001b[0m\n  ssh [-p port] [-l user] [-i keyfile] [-J jumphost] [-A|-a] [-X|-Y] [-L|-R port:host:port] [-D port] [--cp949] [user@]host[:port]\n                                    -A : transférer l’agent (serveurs de confiance uniquement), -a : désactiver\n  telnet host [port]                Connexion Telnet (--cp949 : anciens appareils coréens)\n  serial COM3 [speed]               Console série (par défaut 9600 8N1)\n  rdp [user@]host[:port]            Bureau à distance (Windows RDP)\n  ping [-t] [-n count] [-w ms] [-l size] [-4|-6] host\n                                    Vérifier si un hôte répond (4 fois, -t : jusqu’à Ctrl+C)\n  open                              Ouvrir le gestionnaire de sites\n  open name|number                  Connecter un site enregistré (numéro indiqué par sites)\n  sites [filter]                    Lister les sites enregistrés\n  ls [-l] [-a] [path]               Lister les fichiers (-l : détails, -a : fichiers cachés, motifs comme *.log)\n  dir [/a] [path]                   Lister les fichiers (détails)\n  cd [path], pwd                    Changer de dossier (cd seul : dossier personnel, cd .., cd D:) / dossier courant\n  new                               Créer un nouveau site\n  quick                             Connexion rapide\n  r, reconnect                      Rétablir la dernière connexion\n  clear, cls                        Effacer l’écran\n  exit                              Fermer l’onglet\n  help, ?                           Cette aide\n\n  ←/→, Home/End : déplacer le curseur   ↑/↓ : commande précédente   Ctrl+C : annuler la saisie   Ctrl+L : effacer l’écran"
