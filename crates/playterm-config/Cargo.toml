[package]
name = "playterm-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
log = "0.4.35"
playterm-i18n = { version = "0.8.0", path = "../playterm-i18n" }
playterm-types = { version = "0.8.0", path = "../playterm-types" }
playterm-term = { version = "0.8.0", path = "../playterm-term" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"
