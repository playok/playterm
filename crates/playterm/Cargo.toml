[package]
name = "playterm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = "0.4.45"
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
egui_tiles = "0.18"
encoding_rs = "0.8.44"
env_logger = "0.11.11"
log = "0.4.35"
memmap2 = "0.9.12"
playterm-config = { version = "0.2.0", path = "../playterm-config" }
playterm-i18n = { version = "0.2.0", path = "../playterm-i18n" }
playterm-net = { version = "0.2.0", path = "../playterm-net" }
playterm-term = { version = "0.2.0", path = "../playterm-term" }
rfd = "0.17.2"
ttf-parser = "0.25.1"
unicode-width = "0.2.3"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
serde_json = "1.0.154"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
