[package]
name = "playterm-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
encoding_rs = "0.8.44"
getrandom = "0.4.3"
# Only for the `testing` feature (an SSH server for tests of the app).
rand = { version = "0.10", features = ["thread_rng"], optional = true }
ironrdp-cliprdr = "0.9"
ironrdp-cliprdr-native = "0.9"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-rdpsnd = "0.11"
ironrdp-rdpsnd-native = { version = "0.8", default-features = false }
ironrdp-session = "0.13"
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
ironrdp-tokio = "0.12"
log = "0.4.35"
playterm-i18n = { version = "0.6.0", path = "../playterm-i18n" }
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
smallvec = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "fs"] }
tokio-serial = "5.5.0"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
zeroize = "1.9.1"
ironrdp-rdpdr = "0.9"
ironrdp-rdpdr-native = "0.9"
ironrdp-svc = "0.10"
ironrdp-mstsgu = { version = "0.1", features = ["native-tls"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
# An SSH server for tests (`playterm_net::testing`), never in a release.
testing = ["dep:rand"]

[dev-dependencies]
futures = "0.3.34"
tempfile = "3"
rand = { version = "0.10", features = ["thread_rng"] }
tokio = { version = "1.54.1", features = ["test-util", "process"] }
rcgen = "0.14"
tokio-rustls = "0.26"
