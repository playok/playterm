[package]
name = "playterm-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
log = "0.4.35"
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "fs"] }
tokio-serial = "5.5.0"
zeroize = "1.9.1"

[dev-dependencies]
futures = "0.3.34"
rand = { version = "0.10", features = ["thread_rng"] }
