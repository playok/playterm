# Test RDP server for playterm (see main.rs). Not part of the workspace: ironrdp-server still
# depends on older IronRDP crates than playterm-net.
[package]
name = "dev-rdpd"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
ironrdp-displaycontrol = "0.8"
ironrdp-server = { version = "0.13.0", features = ["helper"] }
rcgen = "0.14"
tokio = { version = "1", features = ["full"] }
